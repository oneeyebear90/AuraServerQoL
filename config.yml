# ============================================================================== #
#                         AuraServerQoL Configuration Notes
# ============================================================================== #
# Config file updated for v1.1.0
# Check for config file updates at https://www.oneeyebear.net/asqol-config
# Report Bugs at https://github.com/oneeyebear90/AuraServerQoL/issues
# Join the Aura Discord and Aura Minecraft Server at https://discord.gg/XmVXXzZ42u
# ------------------------------------------------------------------------------ #
# Dynamic Lighting Settings
# ------------------------------------------------------------------------------ #
AuraDynamicLighting:
  enabled: true

# ------------------------------------------------------------------------------ #
# Auto Tool Replacement Settings
# ------------------------------------------------------------------------------ #
AuraToolBreakReplacement:
  enabled: true
  # If true, replacements match exact tool type first (e.g., Iron Pickaxe -> Iron Pickaxe)
  # If false, searches tier hierarchy (NETHERITE > DIAMOND > IRON > STONE > GOLDEN > WOODEN)
  prioritize-same-tool-type: true

# ------------------------------------------------------------------------------ #
# Boat Jump & Auto-Hurdle Settings
# ------------------------------------------------------------------------------ #
AuraBoatJump:
  enabled: true
  # Cooldown period (in ticks) between triggering manual jumps
  cooldown-ticks: 15
  # Allowed blocks under the boat to trigger jumping
  # You may add more block types here if you want to allow jumping on land/ice/etc.
  allowed-blocks:
    - WATER
    - SEAGRASS
    - KELP
  # Manual Boat Jump Settings (Triggered by Swap Hands keybind 'F' key)
  # Use these settings to tune the jumps to your liking
  manual-jump:
    vertical-velocity: 0.6
    push-speed: 0.38
  # Automatic Obstacle Hurdle Settings
  # Use these settings to tune the obstacle clearance to your liking
  auto-hurdle:
    vertical-velocity: 0.35
    push-speed: 0.28

# ------------------------------------------------------------------------------ #
# Portable Item Disposal Settings
# ------------------------------------------------------------------------------ #
# Allows for right-clicking a lava bucket in player inventory
# to open portable trash can
AuraItemDisposal:
  enabled: true

# ------------------------------------------------------------------------------ #
# Auto-Harvest & Replant Settings
# ------------------------------------------------------------------------------ #
# Automatically replants harvested crops when right-clicked
# and the player has the required seed/crop to replant
AuraAutoHarvest:
  enabled: true
  # Whether to require the player to have the seed/crop to replant
  require-seeds: true

# ------------------------------------------------------------------------------ #
# AuraHarvestXP
# ------------------------------------------------------------------------------ #
# Award XP for harvesting fully grown crops
AuraHarvestXP:
  enabled: true
  min-xp: 1
  max-xp: 3

# ------------------------------------------------------------------------------ #
# Update Checker Settings
# ------------------------------------------------------------------------------ #
CheckForUpdates: true

# ============================================================================== #
